name: docs

# docs/site/ is generated by docs/build.php and published to GitHub Pages.
# The builder uses the Composer development dependencies and runs entirely in PHP.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/source/**'
      - 'docs/assets/**'
      - 'docs/build.php'
      - 'docs/manifest.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install documentation dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Build documentation
        working-directory: docs
        run: php build.php

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
