name: Bug report
description: Something in the framework does not behave the way it says it does
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Not for security issues.** Report those privately — see
        [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you saw, and what you expected instead.
      placeholder: |
        cache::remember() runs the producer on every call when the value is the integer 0.
        I expected the second call to hit the cache.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Smallest reproduction
      description: >
        The least code that shows it — a controller action, a config snippet, a test case.
        A failing Pest test is the fastest thing to act on.
      render: php
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PlatoPHP version
      placeholder: "v0.1.0, or the commit sha if you are on main"
    validations:
      required: true

  - type: input
    id: php
    attributes:
      label: PHP version and SAPI
      placeholder: "8.3.9, php-fpm"
    validations:
      required: true

  - type: input
    id: stores
    attributes:
      label: Cache / queue / session store, if the problem touches one
      description: The driver matters — several of them promise different things on purpose.
      placeholder: "cache_type = redis (phpredis 6.0), queue = redis"

  - type: textarea
    id: anything
    attributes:
      label: Anything else
      description: Stack trace, log lines, what you already ruled out.
